name: Build KickPi Launcher

'on':
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle dependencies to speed up future runs

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Combined and streamlined SDK setup using the action environment
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Built-in Gradle setup action handles permissions and initialization
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kickpi-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
